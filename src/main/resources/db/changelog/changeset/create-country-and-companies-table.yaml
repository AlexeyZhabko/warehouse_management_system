databaseChangeLog:
  - changeSet:
      id: create-sellers-table
      author: azhabko
      changes:
        - createTable:
            schemaName: warehouse
            tableName: countries
            columns:
              - column:
                  name: id
                  autoIncrement: true
                  type: bigint
                  constraints:
                    primaryKey: true
                    unique: true
                    nullable: true
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    unique: true
                    nullable: false
        - createTable:
            schemaName: warehouse
            tableName: companies
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    unique: true
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: country_id
                  type: bigint
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            constraintName: companies_country_foreign_key
            referencedTableSchemaName: warehouse
            referencedTableName: countries
            referencedColumnNames: id
            baseTableSchemaName: warehouse
            baseTableName: companies
            baseColumnNames: country_id
            onDelete: set null
            onUpdate: cascade