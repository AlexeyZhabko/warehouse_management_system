databaseChangeLog:
  - changeSet:
      id: add-delivery-notes-table
      author: azhabko
      changes:
        - createTable:
            schemaName: warehouse
            tableName: delivery_notes
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    unique: true
              - column:
                  name: seller_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: delivery_notes_seller_foreign_key
            baseTableSchemaName: warehouse
            baseTableName: delivery_notes
            baseColumnNames: seller_id
            referencedTableSchemaName: warehouse
            referencedTableName: countries
            referencedColumnNames: id
            onDelete: set null
            onUpdate: cascade
        - addForeignKeyConstraint:
            constraintName: delivery_notes_customer_foreign_key
            baseTableSchemaName: warehouse
            baseTableName: delivery_notes
            baseColumnNames: seller_id
            referencedTableSchemaName: warehouse
            referencedTableName: countries
            referencedColumnNames: id
            onDelete: set null
            onUpdate: cascade